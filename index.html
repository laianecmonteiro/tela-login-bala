<!DOCTYPE html>
<html lang="pt-Br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeiro exercício</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=visibility,visibility_off" />
</head>

<body>
    <section class="container">
        <div class="container-title">
            <h1>BALA <span>.</span></h1>
        </div>
        <div class="container-title">
            <p>Welcome.</p>
            <p>Start your journey now with our management system!</p>
        </div>
    </section>
    <section>
        <div class="container-login">
            <h3>Login to your account</h3>
            <form class="form-login">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
                <label for="password">Password</label>
                <div class="input-password">
                    <input type="password" id="password" name="password" required placeholder="Enter your password" method="post">
                    <span class="material-symbols-outlined toggle-password" id="togglePassword">visibility</span>
                </div>
            </form>
            <button type="submit">Login now</button>
            <p>Don't Have An Account? <a href="">Sign up</a></p>
        </div>
    </section>



    <script src="script.js"></script>
</body>

</html>
